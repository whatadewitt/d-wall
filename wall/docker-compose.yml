# Wall display (docs/spec.md section 10). go2rtc joins in milestone 2.
services:
  wall-server:
    build: .
    image: wall-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.yaml
    ports:
      # LAN interface only (section 10, security rules).
      - "${WALL_BIND_ADDR:?set WALL_BIND_ADDR in .env to the media server's LAN address}:9600:9600"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9600/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "10" }
