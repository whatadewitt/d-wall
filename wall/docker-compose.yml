# Wall display (docs/spec.md section 10): wall-server, the go2rtc stream relay, and Home Assistant (section 14).
services:
  wall-server:
    build: .
    image: wall-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config/config.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      GO2RTC_URL: http://go2rtc:1984
    depends_on: [go2rtc]
    ports:
      # LAN interface only (section 10, security rules).
      - "${WALL_BIND_ADDR:?set WALL_BIND_ADDR in .env to the media server's LAN address}:9600:9600"
    volumes:
      # The whole folder, not the file: a restart then sees edits from any editor.
      - ./config:/app/config:ro
      # The Google service account key stays outside the repo (section 10, secrets).
      - "${GOOGLE_SA_KEY_FILE:?set GOOGLE_SA_KEY_FILE in .env to the service account key file}:/run/secrets/google-service-account.json:ro"
      # Idle-screen photos (section 8), read-only. Fill it with the art seed script (milestone 4 report).
      - "${PHOTOS_DIR:-./photos}:/data/photos:ro"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9600/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "10" }

  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    init: true
    # The config is inline, so go2rtc has no file to write camera addresses into. wall-server adds the
    # streams at runtime. The API (1984) stays on the Docker network; only WebRTC media is published.
    entrypoint: ["go2rtc"]
    command:
      - -config
      - '{"api":{"listen":":1984"},"rtsp":{"listen":""},"webrtc":{"listen":":8555","candidates":["${WALL_BIND_ADDR}:8555"]},"log":{"level":"info"}}'
    ports:
      - "${WALL_BIND_ADDR}:8555:8555/tcp"
      - "${WALL_BIND_ADDR}:8555:8555/udp"
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Home Assistant, the device hub for the home screen (spec section 14). Host networking lets it find
  # devices on the LAN (mDNS, Matter, casting); its web page is on port 8123 of the media server.
  # Its config folder is git-ignored. Updated nightly by scripts/nightly-update.sh, not automatically.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-America/Halifax}
    volumes:
      - "${HA_CONFIG_DIR:-./homeassistant}:/config"
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
